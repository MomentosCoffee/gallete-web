<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galleté · Choose your place</title>
<meta name="description" content="Galleté — gooey cookies & ceremonial matcha, made to be shared. Choose your country.">
<meta name="theme-color" content="#EFDECA">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Bolze';src:url('assets/fonts/bolze.otf') format('opentype');font-weight:400 900;font-display:swap}
@font-face{font-family:'Bolze Script';src:url('assets/fonts/bolze-script.otf') format('opentype');font-display:swap}
:root{
  --pink:#FC82BD; --pink-soft:#FFE3F1; --wine:#6F0021; --wine-soft:#9A2447;
  --matcha:#B7B424; --matcha-deep:#8F8D17; --matcha-bg:#F3F4DE;
  --cream:#EFDFCB; --cream-bg:#EFDECA; --ink:#3A0A1B;
  --font-impact:'Bolze','Archivo',sans-serif; --font-script:'Bolze Script',cursive;
  --font-display:'Fredoka',system-ui,sans-serif; --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);color:var(--ink);background:
  radial-gradient(120% 90% at 15% 0%,var(--pink-soft) 0%,transparent 46%),
  radial-gradient(120% 90% at 90% 100%,var(--matcha-bg) 0%,transparent 50%),
  var(--cream-bg);
  min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
.wrap{flex:1;width:100%;max-width:960px;margin:0 auto;padding:clamp(28px,6vw,56px) clamp(20px,5vw,40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{height:46px;width:auto;margin-bottom:clamp(20px,4vw,32px);animation:pop .6s var(--ease-out) both}
.kick{font-family:var(--font-body);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:.74rem;color:var(--wine-soft);margin-bottom:12px;animation:rise .6s var(--ease-out) .05s both}
h1{font-family:var(--font-impact);text-transform:uppercase;color:var(--wine);font-size:clamp(2.2rem,7vw,4rem);letter-spacing:.005em;line-height:.98;margin-bottom:10px;animation:rise .6s var(--ease-out) .1s both}
.sub{color:var(--ink);opacity:.8;font-size:1.05rem;max-width:34ch;margin:0 auto clamp(28px,5vw,42px);line-height:1.5;animation:rise .6s var(--ease-out) .15s both}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,26px);width:100%;max-width:720px}
.pick{position:relative;display:block;background:#fff;border-radius:26px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 20px 50px -26px rgba(58,10,27,.5);border:1px solid rgba(111,0,33,.06);transition:transform .28s var(--ease-out),box-shadow .28s var(--ease-out);animation:rise .7s var(--ease-out) both}
.pick:nth-child(1){animation-delay:.2s}.pick:nth-child(2){animation-delay:.28s}
.pick:active{transform:scale(.98)}
@media(hover:hover){.pick:hover{transform:translateY(-6px);box-shadow:0 34px 70px -30px rgba(58,10,27,.55)}}
.pick .ph{aspect-ratio:4/3;overflow:hidden;position:relative}
.pick .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease-out)}
@media(hover:hover){.pick:hover .ph img{transform:scale(1.06)}}
.pick .flag{position:absolute;top:12px;left:12px;font-size:1.5rem;background:rgba(255,255,255,.92);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.pick .body{padding:18px 18px 22px;text-align:left}
.pick .country{font-family:var(--font-impact);text-transform:uppercase;font-size:1.35rem;letter-spacing:.01em;color:var(--wine);line-height:1}
.pick .what{font-family:var(--font-display);font-weight:600;font-size:1rem;color:var(--matcha-deep);margin-top:4px;display:flex;align-items:center;justify-content:space-between}
.pick.co .what{color:var(--wine-soft)}
.pick .what .arw{transition:transform .25s var(--ease-out)}
@media(hover:hover){.pick:hover .what .arw{transform:translateX(4px)}}
.tag{position:absolute;top:12px;right:12px;background:var(--pink);color:var(--wine);font-family:var(--font-display);font-weight:700;font-size:.66rem;padding:4px 10px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.pick.co .tag{background:var(--cream);color:var(--wine)}
.foot{text-align:center;padding:22px 20px 26px;color:var(--wine-soft)}
.foot .sig{font-family:var(--font-script);font-size:1.35rem}
.foot a{color:var(--pink);font-weight:700;text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:560px){.cards{grid-template-columns:1fr;max-width:380px}.pick .ph{aspect-ratio:16/10}}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/img/logo-gallete.png" alt="Galleté">
    <span class="kick">A cookie to share · a tea to remember</span>
    <h1>Where are you?</h1>
    <p class="sub">Pick your place and we'll take you to the good stuff. <span style="white-space:nowrap">Elige tu país 🤎</span></p>

    <div class="cards">
      <a class="pick us" href="/matcha" data-country="us" aria-label="United States — Matcha">
        <div class="ph"><img src="assets/img/matcha-iced.jpg" alt="Galleté ceremonial matcha"></div>
        <span class="flag">🇺🇸</span>
        <span class="tag">Shop now</span>
        <div class="body">
          <div class="country">United States</div>
          <div class="what">Ceremonial Matcha <span class="arw">→</span></div>
        </div>
      </a>

      <a class="pick co" href="/colombia" data-country="co" aria-label="Colombia — Cookies">
        <div class="ph"><img src="assets/img/hero-a.jpg" alt="Galleté gooey cookies"></div>
        <span class="flag">🇨🇴</span>
        <span class="tag">Muy pronto</span>
        <div class="body">
          <div class="country">Colombia</div>
          <div class="what">Galletas gooey <span class="arw">→</span></div>
        </div>
      </a>
    </div>
  </div>

  <div class="foot">
    <div class="sig">made to be shared</div>
    <div style="margin-top:6px"><a href="https://www.instagram.com/gallete_co" target="_blank" rel="noopener">@gallete_co</a></div>
  </div>

  <script>
    /* Recuerda la elección para la próxima vez (sin forzar). */
    try{
      document.querySelectorAll('.pick').forEach(function(a){
        a.addEventListener('click',function(){ try{localStorage.setItem('gallete_country',a.dataset.country);}catch(e){} });
      });
    }catch(e){}
  </script>
</body>
</html>
