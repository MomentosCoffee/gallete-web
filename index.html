<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galleté · Choose your place</title>
<meta name="description" content="Galleté — gooey cookies & ceremonial matcha, made to be shared. Choose your country.">
<meta name="theme-color" content="#6F0021">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Bolze';src:url('assets/fonts/bolze.otf') format('opentype');font-weight:400 900;font-display:swap}
@font-face{font-family:'Bolze Script';src:url('assets/fonts/bolze-script.otf') format('opentype');font-display:swap}
:root{
  --pink:#FC82BD; --wine:#6F0021; --wine-soft:#9A2447;
  --matcha:#B7B424; --matcha-deep:#6f6d14; --cream:#EFDFCB;
  --font-impact:'Bolze','Archivo',sans-serif; --font-script:'Bolze Script',cursive;
  --font-display:'Fredoka',system-ui,sans-serif; --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --eo:cubic-bezier(.23,1,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-body);background:#1a0710;color:#fff;overflow:hidden}
a{text-decoration:none;color:inherit}

.gate{display:flex;height:100svh;width:100%;overflow:hidden}
.side{position:relative;flex:1 1 50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transition:flex-basis .55s var(--eo)}
.side.us{animation:slideL .9s var(--eo) both}
.side.co{animation:slideR .9s var(--eo) both}
.side .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);transition:transform .7s var(--eo),filter .5s var(--eo);filter:saturate(1.02)}
.side .shade{position:absolute;inset:0;transition:opacity .5s var(--eo)}
.side.us .shade{background:linear-gradient(to top,rgba(35,40,3,.86) 0%,rgba(35,40,3,.30) 42%,rgba(20,25,0,.30) 100%)}
.side.co .shade{background:linear-gradient(to top,rgba(70,0,21,.88) 0%,rgba(70,0,21,.32) 42%,rgba(40,0,12,.34) 100%)}
.side-in{position:relative;z-index:2;text-align:center;padding:0 24px 13vh;transform:translateY(10px);opacity:0;animation:rise .8s var(--eo) .5s both}
.flag{font-size:2rem;display:inline-block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));margin-bottom:10px}
.ctry{display:block;font-family:var(--font-impact);text-transform:uppercase;letter-spacing:.01em;font-size:clamp(1.9rem,4.4vw,3.2rem);line-height:.98;text-shadow:0 3px 20px rgba(0,0,0,.35)}
.what{display:block;font-family:var(--font-display);font-weight:600;font-size:clamp(1rem,2vw,1.25rem);margin-top:6px;opacity:.95}
.go{display:inline-flex;align-items:center;gap:9px;margin-top:20px;font-family:var(--font-display);font-weight:600;font-size:.95rem;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.55);color:#fff;padding:.7rem 1.4rem;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .25s var(--eo),transform .2s var(--eo)}
.go i{font-style:normal;transition:transform .25s var(--eo)}
.side .tag{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;z-index:2;font-family:var(--font-display);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 12px;border-radius:999px;opacity:0;animation:rise .8s var(--eo) .7s both}
.side.us .tag{background:var(--pink);color:var(--wine);left:20px;right:auto}
.side.co .tag{background:var(--cream);color:var(--wine)}

/* hover: la mitad enfocada crece */
@media(hover:hover) and (min-width:721px){
  .gate:hover .side{flex-basis:42%}
  .gate .side:hover{flex-basis:58%}
  .side:hover .bg{transform:scale(1.13)}
  .side:hover .shade{opacity:.72}
  .side:hover .go{background:rgba(255,255,255,.26)}
  .side:hover .go i{transform:translateX(5px)}
}
.side:active{filter:brightness(.96)}

/* marca central flotante */
.brandmark{position:absolute;top:clamp(26px,7vh,64px);left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;width:max-content}
.brandmark img{height:clamp(54px,8.4vw,78px);width:auto;filter:drop-shadow(0 6px 20px rgba(0,0,0,.45));animation:pop .8s var(--eo) both,float 5s ease-in-out 1s infinite}
.brandmark .wr{display:block;margin-top:12px;font-family:var(--font-body);font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:.66rem;color:#fff;opacity:0;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:rise .8s var(--eo) .35s both}
.divider{position:absolute;top:0;left:50%;width:1px;height:100%;background:rgba(255,255,255,.16);z-index:4;transform:translateX(-50%);animation:growH 1s var(--eo) .3s both}
.footnote{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;font-family:var(--font-script);font-size:1.32rem;color:#fff;white-space:nowrap;background:rgba(40,8,20,.46);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);padding:6px 22px;border-radius:999px;text-shadow:0 1px 6px rgba(0,0,0,.45);opacity:0;animation:fade .8s var(--eo) .9s both}
@keyframes fade{from{opacity:0}to{opacity:1}}

@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes growH{from{transform:translateX(-50%) scaleY(0)}to{transform:translateX(-50%) scaleY(1)}}

@media(max-width:720px){
  .gate{flex-direction:column}
  .side{flex-basis:50%}
  .side-in{padding-bottom:7vh}
  .divider{width:100%;height:1px;top:50%;left:0;transform:none;animation:growW 1s var(--eo) .3s both}
  .brandmark{top:calc(env(safe-area-inset-top,0px) + 16px)}
  .footnote{display:none}
}
@keyframes growW{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.side-in,.brandmark .wr,.brandmark img,.side .tag,.footnote{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
  <main class="gate">
    <a class="side us" href="/matcha" data-c="us" aria-label="United States — Ceremonial Matcha">
      <div class="bg" style="background-image:url('assets/img/matcha-whisk.jpg')"></div>
      <div class="shade"></div>
      <span class="tag">Shop now</span>
      <div class="side-in">
        <span class="flag">🇺🇸</span>
        <span class="ctry">United States</span>
        <span class="what">Ceremonial Matcha</span>
        <span class="go">Enter <i>→</i></span>
      </div>
    </a>

    <a class="side co" href="/colombia" data-c="co" aria-label="Colombia — Galletas gooey">
      <div class="bg" style="background-image:url('assets/img/hero-a.jpg')"></div>
      <div class="shade"></div>
      <span class="tag">Muy pronto</span>
      <div class="side-in">
        <span class="flag">🇨🇴</span>
        <span class="ctry">Colombia</span>
        <span class="what">Galletas gooey</span>
        <span class="go">Entrar <i>→</i></span>
      </div>
    </a>

    <div class="brandmark">
      <img src="assets/img/logo-gallete-cream.png" alt="Galleté" onerror="this.src='assets/img/logo-gallete.png'">
      <span class="wr">Where are you? · ¿Dónde estás?</span>
    </div>
  </main>

  <script>
    try{document.querySelectorAll('.side').forEach(function(a){
      a.addEventListener('click',function(){try{localStorage.setItem('gallete_country',a.dataset.c);}catch(e){}});
    });}catch(e){}
  </script>
</body>
</html>
